name: Synonymy & Description
on:
  schedule:
    - cron: '0 6 * * 3'
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    environment: synonymy-description
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Restore cached Node dependencies
        id: restore-cached-node-dependencies
        uses: actions/cache/restore@v5
        with:
          path: |
            ./node_modules
            package-lock.json
          key: node-dependencies-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            node-dependencies-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install Node dependencies
        if: steps.restore-cached-node-dependencies.outputs.cache-hit != 'true'
        run: npm install

      - name: Cache Node dependencies
        id: cache-node-dependencies
        uses: actions/cache/save@v5
        if: steps.restore-cached-node-dependencies.outputs.cache-hit != 'true'
        with:
          path: |
            ./node_modules
            package-lock.json
          key: ${{ steps.restore-cached-node-dependencies.outputs.cache-primary-key }}

      - name: Create temporary directory
        run: mkdir ./tmp

      - name: Unzip tags
        run: unzip tags.zip

      - name: Generate prompts
        id: generate-prompts
        run: node generate-prompts.js

      - name: Rasterize
        if: steps.generate-prompts.outputs.queued-symbols-count > 0
        run: node rasterize.js

      - name: Restore cached Python virtual environment
        id: restore-cached-python-venv
        uses: actions/cache/restore@v5
        if: steps.generate-prompts.outputs.queued-symbols-count > 0
        with:
          path: python_venv
          key: python-venv-${{ runner.os }}-${{ hashFiles('./verify.requirements.txt') }}
          restore-keys: |
            python-venv-${{ runner.os }}-${{ hashFiles('./verify.requirements.txt') }}

      - name: Install Python dependencies
        if: steps.generate-prompts.outputs.queued-symbols-count > 0 && steps.restore-cached-python-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv python_venv
          python_venv/bin/pip install -r verify.requirements.txt

      - name: Cache Python virtual environment
        id: cache-python-venv
        uses: actions/cache/save@v5
        if: steps.generate-prompts.outputs.queued-symbols-count > 0 && steps.restore-cached-python-venv.outputs.cache-hit != 'true'
        with:
          path: python_venv
          key: ${{ steps.restore-cached-python-venv.outputs.cache-primary-key }}

      - name: Restore cached CLIP model
        id: restore-cached-clip-model
        uses: actions/cache/restore@v5
        if: steps.generate-prompts.outputs.queued-symbols-count > 0
        with:
          path: |
            ~/.cache/clip
          key: clip-model-${{ runner.os }}
          restore-keys: |
            clip-model-${{ runner.os }}

      - name: Install Ollama
        if: steps.generate-prompts.outputs.queued-symbols-count > 0
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Initialize Ollama
        if: steps.generate-prompts.outputs.queued-symbols-count > 0
        run: |
          ollama serve || true &
          sleep 5

      - name: Pull Gemma 4 E4B model
        if: steps.generate-prompts.outputs.queued-symbols-count > 0
        run: ollama pull gemma4:e4b

      - name: List synonymies & create descriptions
        if: steps.generate-prompts.outputs.queued-symbols-count > 0
        run: |
          chmod +x ./tmp/list-synonymies-and-create-descriptions.sh
          ./tmp/list-synonymies-and-create-descriptions.sh

      - name: Merge synonymies & descriptions
        if: steps.generate-prompts.outputs.queued-symbols-count > 0
        run: |
          zip -ru synonymies.zip ./synonymies # -x "*.DS_Store"
          zip -ru descriptions.zip ./descriptions # -x "*.DS_Store"

      - name: Separate changed files
        if: steps.generate-prompts.outputs.queued-symbols-count > 0
        run: |
          mkdir -p "./deploy"
          cp -f "synonymies.zip" "./deploy/synonymies.zip"
          cp -f "descriptions.zip" "./deploy/descriptions.zip"
          cp -f "./tmp/timestamps.json" "./deploy/timestamps.json"

      - name: Deploy with gh-pages
        if: steps.generate-prompts.outputs.queued-symbols-count > 0
        run: |
          git remote set-url origin https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          npx gh-pages -a -d deploy -u "github-actions-bot <support+actions@github.com>" -b main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
