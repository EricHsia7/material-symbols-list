name: Build
on:
  schedule:
    - cron: '0 16 * * 1,2,3,4,5'
    - cron: '30 1 * * 0,6'
  workflow_dispatch:

jobs: 
  build:
    runs-on: ubuntu-latest
    environment: build
    steps: 
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Restore cached Node dependencies
        id: restore-cached-node-dependencies
        uses: actions/cache/restore@v5
        with:
          path: |
            ./node_modules
            package-lock.json
          key: node-dependencies-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            node-dependencies-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install Node dependencies
        if: steps.restore-cached-node-dependencies.outputs.cache-hit != 'true'
        run: npm install

      - name: Cache Node dependencies
        id: cache-node-dependencies
        uses: actions/cache/save@v5
        if: steps.restore-cached-node-dependencies.outputs.cache-hit != 'true'
        with:
          path: |
            ./node_modules
            package-lock.json
          key: ${{ steps.restore-cached-node-dependencies.outputs.cache-primary-key }}
      
      - name: Get pip cache directory
        id: get-pip-cache-directory
        run: echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT

      - name: Restore cached Python dependencies
        id: restore-cached-python-dependencies
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.get-pip-cache-directory.outputs.dir }}
          key: python-dependencies-build-v1
          restore-keys: |
            python-dependencies-build-v1

      - name: Install Python dependencies
        run: pip install numpy==2.2.6 torch==2.12.0

      - name: Cache Python dependencies
        id: cache-python-dependencies
        uses: actions/cache/save@v5
        if: steps.restore-cached-python-dependencies.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.get-pip-cache-directory.outputs.dir }}
          key: ${{ steps.restore-cached-python-dependencies.outputs.cache-primary-key }}

      - name: Unzip tags
        run: unzip tags.zip

      - name: Unzip synonymies
        run: unzip synonymies.zip

      - name: Build
        run: |
          node build.js
          python similarity.py
          node similarity.js
          node manifest.js

      - name: Copy Symbol Search to dist
        run: cp -r index.html ./dist/index.html

      - name: Deploy with gh-pages
        run: |
          git remote set-url origin https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          npx gh-pages -d dist -u "github-actions-bot <support+actions@github.com>" -b dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
