name: Sync Source
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  sync: # The name of the job
    runs-on: ubuntu-latest # The type of runner to use
    steps: 
      - name: Check out repository code # The name of the step
        uses: actions/checkout@v4 # The action to use

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x' # The version of Node.js to use

      - name: Install Node dependencies
        run: npm install

      - name: Deploy with gh-pages
        run: |
          git remote set-url origin https://git:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          npx gh-pages -d . -a -u "github-actions-bot <support+actions@github.com>" -b process
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}